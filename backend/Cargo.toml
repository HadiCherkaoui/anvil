[workspace]
resolver = "3"

[package]
name = "anvil"
version = "0.2.0"
edition = "2024"
description = "k8s-native Minecraft server panel"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.cherkaoui.ch/HadiCherkaoui/anvil"
readme = "../README.md"
keywords = ["kubernetes", "minecraft", "panel", "homelab"]
categories = ["web-programming::http-server"]

[features]
# One of `serve-dir` or `embed` must be enabled for the binary to actually
# serve the static frontend bundle. With neither, the static-serve module is
# absent and the router has no fallback (useful only for `cargo test`).
# Enabling both is a hard compile-time error — see src/static_serve.rs.
default = []
serve-dir = ["tower-http/fs"]
embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
kube = { version = "3.1.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
mime_guess = { version = "2.0.5", optional = true }
rand = "0.10.1"
rust-embed = { version = "8.11.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "chrono", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
jiff = "0.2.24"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Tracing's message templates use `{name}` braces inside string literals;
# the `literal_string_with_formatting_args` lint flags them as accidental
# format placeholders. Allow per the ms-rust skill (M-LOG-STRUCTURED).
literal_string_with_formatting_args = "allow"
# Acceptable for a single-binary application crate (one consumer of deps).
multiple_crate_versions = "allow"
