# pnpm 11 config — the package-script allowlist moved here from
# `package.json#pnpm.onlyBuiltDependencies` (which pnpm 11 silently
# ignores). Each entry must be `true` (run the package's postinstall
# scripts) or `false` (skip them); without an entry pnpm 11 refuses
# the install with ERR_PNPM_IGNORED_BUILDS.
#
# - sharp: Next.js' image processor. Unused at runtime because we set
#   `output: 'export'` + `images.unoptimized: true`, but Next.js still
#   pulls it in as a dep so pnpm needs to know what to do with its
#   build script.
# - unrs-resolver: native module resolver loaded by eslint-config-next.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Transitive-dependency security pins. Every entry is a package we do not
# depend on directly — the vulnerable version is hard-pinned by a parent
# (Next.js pins postcss exactly; ESLint drags in minimatch@3 -> brace-expansion@1)
# so bumping our own deps cannot reach them. Each pin is the lowest fixed
# release named by the advisory, kept inside the parent's major so nothing
# breaks. Drop an entry once the parent ships a fixed range on its own.
#
# A `<pkg>@<major>` key pins one major at a time, for packages that resolve to
# several incompatible lineages at once.
#
# Known gap: brace-expansion@1 stays flagged by GHSA-mh99-v99m-4gvg, whose
# affected range is a flat `<=5.0.7` even though the fix only ever landed on
# 5.x. It cannot be cleared here — see the note on the pin below — and it is
# build-time only: node_modules lives in the Dockerfile's frontend-builder
# stage and never reaches the distroless runtime image.
overrides:
  "@babel/core": "^7.29.6" # GHSA-4x5r-pxfx-6jf8 — arbitrary file read
  # Split per-major and NOT unified on 5.x, which would look like the way to
  # clear GHSA-mh99-v99m-4gvg: minimatch@3 does
  # `var expand = require('brace-expansion')` and calls it directly, but 5.x's
  # CommonJS build exports a namespace object, so forcing 5.x there dies with
  # "expand is not a function" the moment ESLint expands a glob. Dropping
  # minimatch@3 instead is no cheaper — eslint, @eslint/eslintrc and three
  # eslint-plugin-* packages all still depend on it, so it needs a coordinated
  # ESLint 10 upgrade rather than an override. 1.1.17 is the newest 1.x.
  "brace-expansion@1": "^1.1.17" # GHSA-3jxr-9vmj-r5cp — DoS
  "brace-expansion@5": "^5.0.8" # GHSA-jxxr-4gwj-5jf2, GHSA-mh99-v99m-4gvg — DoS
  "js-yaml@4": "^4.3.0" # GHSA-52cp-r559-cp3m, GHSA-h67p-54hq-rp68 — quadratic CPU
  postcss: "^8.5.18" # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849, GHSA-qx2v-qp2m-jg93
  sharp: "^0.35.0" # GHSA-f88m-g3jw-g9cj — inherited libvips CVEs
