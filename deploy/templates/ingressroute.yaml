{{- if .Values.ingress.enabled -}}
{{- /* Traefik-native IngressRoute (CRD: traefik.io/v1alpha1). Uses the
       Traefik cert resolver instead of a standard Ingress so the TLS
       configuration is expressed entirely in the spec (certResolver field)
       without a separate cert-manager Certificate resource. */ -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "anvil.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingress.entryPoint }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "anvil.fullname" . }}
          port: 8080
  {{- if .Values.ingress.tls.enabled }}
  tls:
    certResolver: {{ .Values.ingress.tls.certResolver | quote }}
  {{- end }}
{{- end }}
