{{- include "anvil.requireMcDefaults" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anvil.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
data:
  # Bind address inside the Pod. The Service targets containerPort 8080.
  ANVIL_BIND_ADDR: "0.0.0.0:8080"
  # SQLite path inside the mounted PVC.
  ANVIL_DATABASE_URL: "sqlite:///var/lib/anvil/anvil.db?mode=rwc"
  # Namespace the panel reads/writes managed Minecraft resources in.
  ANVIL_MC_NAMESPACE: {{ .Values.mcNamespace | quote }}
  # `tracing` filter directive.
  ANVIL_LOG_LEVEL: {{ .Values.logLevel | quote }}
  # Default StorageClass for managed-server PVCs. Required.
  ANVIL_MC_STORAGE_CLASS: {{ .Values.mcDefaults.storageClassName | quote }}
  # Default Service type for managed servers (overridable per server).
  ANVIL_MC_SVC_TYPE: {{ .Values.mcDefaults.serviceType | quote }}
  # Hostname/IP used to display NodePort server addresses. Empty = "<unset>".
  ANVIL_NODE_HOST: {{ .Values.mcDefaults.nodeHost | quote }}
  # Whether the cluster has a LoadBalancer provider.
  ANVIL_LB_SUPPORTED: {{ .Values.mcDefaults.loadbalancerSupported | quote }}
