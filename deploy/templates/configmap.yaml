{{- include "anvil.requireMcDefaults" . -}}
{{- include "anvil.requireOidc" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anvil.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
data:
  ANVIL_BIND_ADDR: "0.0.0.0:8080"
  ANVIL_DATABASE_URL: "sqlite:///var/lib/anvil/anvil.db?mode=rwc"
  ANVIL_MC_NAMESPACE: {{ .Values.mcNamespace | quote }}
  ANVIL_LOG_LEVEL: {{ .Values.logLevel | quote }}
  ANVIL_MC_STORAGE_CLASS: {{ .Values.mcDefaults.storageClassName | quote }}
  ANVIL_MC_SVC_TYPE: {{ .Values.mcDefaults.serviceType | quote }}
  ANVIL_NODE_HOST: {{ .Values.mcDefaults.nodeHost | quote }}
  ANVIL_LB_SUPPORTED: {{ .Values.mcDefaults.loadbalancerSupported | quote }}
  {{- if .Values.oidc.enabled }}
  # --- OIDC -------------------------------------------------------------------
  ANVIL_OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | quote }}
  ANVIL_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  ANVIL_OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  ANVIL_ALLOWED_SUBS: {{ .Values.oidc.allowedSubs | quote }}
  {{- end }}
  ANVIL_MODPACK_POLL_MINUTES: {{ .Values.modpack.pollIntervalMinutes | quote }}
  # Always emitted — the backend requires it at startup. When
  # snapshotsPvc.enabled=false the operator must provide a PVC with this
  # name in mcNamespace themselves.
  ANVIL_MODPACK_SNAPSHOTS_PVC: "mc-snapshots"
  # --- Managed-server image / timezone defaults ---------------------------
  ANVIL_MC_ALPINE_IMAGE: {{ .Values.mcDefaults.alpineImage | quote }}
  ANVIL_MC_TIMEZONE: {{ .Values.mcDefaults.timezone | quote }}
  ANVIL_MC_ITZG_IMAGE: {{ .Values.mcDefaults.itzgImage | quote }}
  ANVIL_MC_BUSYBOX_IMAGE: {{ .Values.mcDefaults.busyboxImage | quote }}
