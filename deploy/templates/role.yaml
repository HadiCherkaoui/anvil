{{- if .Values.rbac.create -}}
{{- /* Cross-namespace: the Role lives in `mcNamespace`, not the release ns. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "anvil.fullname" . }}-mc
  namespace: {{ .Values.mcNamespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
rules:
  # Lifecycle of managed servers (apps/StatefulSet + scale subresource).
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  # Storage and networking primitives co-created with each StatefulSet.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod inspection + log streaming. Sub-project D adds create+delete on
  # the helper Pod (mc-{id}-files) which mounts the data PVC while the
  # server is stopped; we own its full lifecycle.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # Live CPU/memory from metrics-server for GET /api/servers/{id}/metrics.
  # Separate API group from core pods, so it needs its own rule.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
  # File browser (sub-project D) — exec into pods for streamed file ops.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # RCON Secrets land in M5; surface RBAC now so the chart contract is stable.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # M5: backup / swap / restore Jobs spawned by the update orchestrator.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
{{- end }}
