{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) -}}
{{- include "anvil.requireOidc" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anvil.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANVIL_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  ANVIL_SESSION_KEY: {{ .Values.oidc.sessionKey | quote }}
{{- end -}}
{{- if and .Values.secrets.cfApiKey (not .Values.secrets.cfApiKeyExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anvil.fullname" . }}-cf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  CF_API_KEY: {{ .Values.secrets.cfApiKey | quote }}
---
# Sister Secret in the managed-server namespace so the per-server itzg
# pods can pull CF_API_KEY via secretKeyRef. Same key, second namespace —
# a panel-side Secret can't be cross-namespaced into the MC pods.
apiVersion: v1
kind: Secret
metadata:
  name: cf-api-key
  namespace: {{ .Values.mcNamespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
type: Opaque
stringData:
  CF_API_KEY: {{ .Values.secrets.cfApiKey | quote }}
{{- end -}}
