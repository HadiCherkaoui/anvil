apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvil.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anvil.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate so the old Pod releases the RWO PVC before the new one binds it.
  # rolling updates would deadlock on the single-attach SQLite volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "anvil.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the rendered ConfigMap / Secret content changes.
        # Without these, `helm upgrade` that only edits values leaves the old
        # config live until a manual restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "anvil.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "anvil.serviceAccountName" . }}
      securityContext:
        # Aligns with the `:nonroot` distroless tag (uid 65532). fsGroup makes
        # the mounted PVC writable by that uid without an initContainer chown.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvil
          image: {{ include "anvil.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "anvil.fullname" . }}
            {{- if .Values.oidc.enabled }}
            - secretRef:
                name: {{ default (printf "%s-oidc" (include "anvil.fullname" .)) .Values.oidc.existingSecret }}
            {{- end }}
            {{- if or .Values.secrets.cfApiKey .Values.secrets.cfApiKeyExistingSecret }}
            - secretRef:
                name: {{ default (printf "%s-cf" (include "anvil.fullname" .)) .Values.secrets.cfApiKeyExistingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # /var/lib/anvil is always mounted writable: the root FS is
          # read-only and ANVIL_DATABASE_URL points here, so SQLite needs a
          # writable volume. PVC when persistence is on; ephemeral emptyDir
          # otherwise (DB resets on restart — for throwaway/test installs).
          volumeMounts:
            - name: data
              mountPath: /var/lib/anvil
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anvil.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
