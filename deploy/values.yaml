# anvil Helm chart values. Override per-deployment; legal values documented in docs/cluster-profile.md and ADR 0004.

image:
  repo: gitlab.cherkaoui.ch/hadicherkaoui/anvil
  # Empty string falls back to `latest`. Pin a `:<commit-sha>` here in production for rollback.
  tag: ""
  pullPolicy: IfNotPresent

# Traefik IngressRoute for the panel. Disabled by default — turn on once
# DNS for `host` resolves to the cluster's traefik LoadBalancer IP.
ingress:
  enabled: false
  # Traefik entryPoint name. The homelab traefik install uses "websecure"
  # (TLS-terminating) and "web" (plain HTTP). websecure is the right pick
  # when tls.enabled.
  entryPoint: websecure
  # FQDN that traefik should route to the panel.
  host: anvil.example.local
  # Optional list of Traefik middleware refs (e.g. security-headers, auth).
  # Example: [{ name: security-headers, namespace: traefik }]
  middlewares: [ ]
  tls:
    enabled: false
    # Name of the Traefik certResolver to issue/renew the cert. The homelab
    # traefik chart configures `letsencrypt`; see infrastructure/traefik/.
    certResolver: letsencrypt

# Namespace where managed Minecraft resources live. Created out-of-band
# (Flux owns it on the homelab cluster — commit e244686 in homelab-k8s-fluxcd);
# the chart does NOT include a Namespace template.
mcNamespace: mc

mcDefaults:
  # REQUIRED. The Helm template fails to render if unset, forcing the
  # operator to confirm the right StorageClass for their cluster. Homelab
  # default per cluster-profile.md: `tank` (zfs.csi.openebs.io).
  storageClassName: ""
  # Cluster-wide default for managed-server Services. Overridable per-server
  # in the panel UI. On the homelab cluster, LoadBalancer is fulfilled
  # by Cilium LB IPAM (default-pool, see cluster-profile.md).
  serviceType: LoadBalancer
  # External hostname or IP of any cluster node, used by the panel to
  # display NodePort server addresses (host:nodePort). Leave empty to
  # display "<unset>" — the panel will not auto-discover Node IPs.
  nodeHost: ""
  # Whether the cluster has a LoadBalancer provider (Cilium LB-IPAM,
  # MetalLB, cloud LB, …). When false, requests for
  # exposure_mode=loadbalancer are rejected with 502 lb_unavailable.
  # Homelab default per cluster-profile.md: true.
  loadbalancerSupported: true
  # Alpine image used by the per-server file-browser helper Pod
  # and by the modpack mod-sync Job. Pin by digest, not tag — both
  # workloads mount per-server data, so a tag-mutation supply-chain
  # attack must not be able to swap the image out from under us.
  alpineImage: "alpine:3.20"
  # IANA timezone applied as the TZ env var on every managed MC pod. Sets
  # log-timestamp locale for Minecraft + JVM + mc-image-helper. Etc/UTC
  # ships as the universal default; override per-deployment to match the
  # operator's locale (e.g. "Europe/Zurich"). itzg's image bundles tzdata.
  timezone: "Etc/UTC"
  # Container image used by every managed MC StatefulSet across all
  # providers (vanilla, modded, modrinth, paper, curseforge). Same image
  # everywhere means the cluster only pulls one upstream tag. Pin by
  # digest in production: itzg/minecraft-server@sha256:<digest>.
  itzgImage: "itzg/minecraft-server:java25"
  # Image used by backup, restore, and snapshot-cleanup Jobs. busybox
  # ships tar + sh and is tiny. Pin by digest in production.
  busyboxImage: "busybox:1.36"

# Persistence for the panel's own SQLite database. The PVC mounts at
# /var/lib/anvil; ANVIL_DATABASE_URL points the backend at that path.
persistence:
  enabled: true
  # Empty string => cluster default StorageClass.
  storageClassName: ""
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

rbac:
  create: true
  # Empty string => the chart generates a SA named after the release.
  serviceAccountName: ""

# Backend log filter. Mirrors the ANVIL_LOG_LEVEL env var.
# Examples: "info" (default), "debug", "info,kube=warn".
logLevel: info

# Authentik OIDC. The backend REQUIRES auth — it refuses to start without
# the OIDC env vars — so this defaults on. When `enabled`, the chart also
# REQUIRES `ingress.tls.enabled` and the issuer/client/redirect/secret/session
# values below; missing ones fail `helm install` at render with a clear
# message (see `requireOidc` in _helpers.tpl). See docs/authentik-setup.md
# for the manual Provider/Application setup.
oidc:
  # Must stay true — the backend refuses to start without OIDC, so the
  # chart fails at render when set false (instead of shipping a
  # crash-looping pod).
  enabled: true
  # Authentik issuer URL — the full provider page, e.g.
  # https://authentik.cherkaoui.ch/application/o/anvil/
  issuerUrl: ""
  # OAuth2 Client ID surfaced by Authentik for the Anvil application.
  clientId: ""
  # Public callback URL Authentik redirects to after login. Must equal the
  # "Redirect URIs" field on the Authentik provider, exactly.
  redirectUrl: ""
  # OAuth2 Client Secret. Prefer `existingSecret` in production.
  clientSecret: ""
  # 32-byte HMAC key, base64-encoded (`openssl rand -base64 32`). Used to
  # sign the session JWT and to derive the encrypted OIDC-state cookie key.
  # Prefer `existingSecret` in production. Rotating this invalidates all
  # active sessions.
  sessionKey: ""
  # Optional comma-separated list of Authentik subject UUIDs allowed to use
  # the panel. Empty (default) = any user the Authentik application is
  # bound to is allowed.
  allowedSubs: ""
  # Name of an out-of-band Secret carrying ANVIL_OIDC_CLIENT_SECRET +
  # ANVIL_SESSION_KEY. When set, the chart does NOT manage a Secret;
  # `clientSecret` and `sessionKey` are ignored. Recommended for production
  # so Helm rollbacks don't reset secrets.
  existingSecret: ""

# CurseForge modpack support. When `secrets.cfApiKey` (or
# `secrets.cfApiKeyExistingSecret`) is set, the backend enables the
# CurseForge provider, the hourly version poller, and the update
# orchestrator. The poller writes `modpack_versions` rows the frontend
# reads to surface "Update available" badges.
secrets:
  # CurseForge API key. Get one at https://console.curseforge.com/. Inline
  # set is fine for `helm install --set`; for sealed-secret deployments,
  # use `cfApiKeyExistingSecret` instead.
  #
  # When set inline, the chart provisions the same key as TWO Secrets:
  #   1. `<release>-cf` in the release namespace (panel reads it via envFrom)
  #   2. `cf-api-key` in `mcNamespace` (per-server itzg pods reference it
  #      via `secretKeyRef` so TYPE=AUTO_CURSEFORGE can download server packs)
  cfApiKey: ""
  # Name of an out-of-band Secret in the release namespace carrying
  # CF_API_KEY. Use this for SOPS / sealed-secrets workflows so Helm
  # rollbacks don't reset the key.
  #
  # IMPORTANT: when this is set, the chart does NOT manage the `cf-api-key`
  # Secret in `mcNamespace` — you must provide it yourself, e.g. as a
  # second SOPS-encrypted Secret with `metadata.name: cf-api-key`,
  # `metadata.namespace: <mcNamespace>`, and `stringData.CF_API_KEY: <key>`.
  # Without it, MC StatefulSet pods will fail with `CreateContainerConfigError:
  # secret "cf-api-key" not found`.
  cfApiKeyExistingSecret: ""

modpack:
  # How often the backend polls CurseForge for new ServerFiles versions.
  # Each tick costs one HTTPS request per CF-backed server. 60min is
  # comfortable; CurseForge rate-limits at much higher rates.
  pollIntervalMinutes: 60
  # Shared snapshots PVC for the tar-based backup / mod-sync path. The
  # backend REQUIRES a PVC named `mc-snapshots` in mcNamespace. `enabled`
  # gates only the chart-managed PVC resource — set it false ONLY when you
  # provision that PVC out-of-band (the env var is emitted either way).
  snapshotsPvc:
    enabled: true
    # StorageClass for the snapshots PVC. Defaults to the cluster's
    # default-marked SC ("" = let k8s pick).
    storageClass: ""
    # Sized for ~5 servers × 3 backups × ~7 GB ≈ 105 GiB. Resize when
    # adding servers or raising the BACKUP_KEEP_COUNT constant in code.
    size: 100Gi
