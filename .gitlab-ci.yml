# anvil CI/CD pipeline.
#
# Three stages: test (parallel lint + unit tests), build (frontend bundle and
# release binary), image (multi-stage Docker push). No deploy stage — Flux
# pulls from the registry on its own cadence.
#
# Reproducibility:
#   - cargo: --locked, --frozen on all build/test invocations
#   - pnpm:  --frozen-lockfile
#   - base images: pinned to a major (rust:1, node:22-slim) — bump deliberately
#
# Path filters keep feature branches cheap: only the relevant jobs run when
# the matching subtree changes.

stages:
  - test
  - build
  - image

# ----------------------------------------------------------------------------
# Cargo cache (anchor reused by every Rust job)
# ----------------------------------------------------------------------------
.rust_cache: &rust_cache
  key:
    files:
      - backend/Cargo.lock
  paths:
    - backend/.cargo/registry/
    - backend/.cargo/git/
  policy: pull-push

.rust_defaults: &rust_defaults
  image: rust:1-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/backend/.cargo
  cache:
    <<: *rust_cache
  before_script:
    - rustc --version && cargo --version
    # `rust:1-bookworm` no longer ships rustfmt/clippy in the toolchain since
    # the 1.95 base bump (cargo fmt/clippy fail otherwise). Idempotent.
    - rustup component add rustfmt clippy
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

# ----------------------------------------------------------------------------
# pnpm cache anchor
# ----------------------------------------------------------------------------
.pnpm_defaults: &pnpm_defaults
  # NOTE: do NOT set PATH in `variables:` — GitLab runner does not expand
  # nested $vars there, so a `PATH: "$X:$PATH"` becomes the literal string
  # `$X:$PATH`. runc then can't find /bin/sh and the pod fails to start.
  # Extend PATH inside before_script (real shell, real expansion) instead.
  image: node:22
  variables:
    PNPM_HOME: /builds/HadiCherkaoui/anvil/.pnpm
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/node_modules/
      - .pnpm-store/
    policy: pull-push
  before_script:
    - export PATH="$PNPM_HOME:$PATH"
    - corepack enable
    - cd frontend
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

# ----------------------------------------------------------------------------
# test stage — parallel
# ----------------------------------------------------------------------------
rust-fmt:
  <<: *rust_defaults
  stage: test
  script:
    - set -euo pipefail
    - cd backend && cargo fmt --all -- --check

rust-clippy:
  <<: *rust_defaults
  stage: test
  script:
    - set -euo pipefail
    - cd backend
    # Both feature flavours need to be linted independently — `--all-features`
    # would activate `serve-dir` *and* `embed`, which is a hard
    # `compile_error!` (mutex). Two passes keep both code paths honest.
    - cargo clippy --all-targets --features serve-dir --locked -- -D warnings
    # `embed` reads ../frontend/out/ at compile time via rust-embed's derive.
    # The `pnpm-build` job that populates it lives in a later stage, so for
    # clippy we plant an empty placeholder — the derive expands to an `Assets`
    # impl with zero bundled files but the `get` method is still in scope,
    # which is all the lints need.
    - mkdir -p ../frontend/out
    - cargo clippy --all-targets --features embed --locked -- -D warnings

rust-test:
  <<: *rust_defaults
  stage: test
  script:
    - set -euo pipefail
    - cd backend && cargo test --features serve-dir --locked

# Typecheck + lint are run locally before commits — keeping them out of CI
# avoids the GitLab K8s runner's flakiness with the pnpm container while
# still leaving pnpm-build below to validate the bundle compiles.

# ----------------------------------------------------------------------------
# build stage — produces the frontend bundle and the release binary
# ----------------------------------------------------------------------------
pnpm-build:
  <<: *pnpm_defaults
  stage: build
  script:
    - set -euo pipefail
    - pnpm build
  artifacts:
    paths:
      - frontend/out/
    expire_in: 1 day
  # Override the shared pnpm rule: pnpm-build also runs on backend changes
  # because cargo-build-release embeds frontend/out/ via rust-embed and
  # docker-build's first stage rebuilds it. If we let pnpm-build skip on
  # backend-only commits, every dependent job's `needs:` becomes unsatisfied
  # and GitLab fails the whole pipeline.
  rules:
    - changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml

# Release binary (only builds on main — feature branches don't need it).
cargo-build-release:
  <<: *rust_defaults
  stage: build
  needs:
    - job: pnpm-build
      artifacts: true
  script:
    - set -euo pipefail
    - cd backend && cargo build --release --locked --features embed
  artifacts:
    paths:
      - backend/target/release/anvil
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml

# ----------------------------------------------------------------------------
# image stage — pushes :<sha> + :latest to the GitLab project registry
# ----------------------------------------------------------------------------
docker-build:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: "/certs"
  # `needs:` here is for sequencing — the Dockerfile re-runs `pnpm build`
  # internally in stage 1, so we don't actually consume the artifact. Holding
  # the dependency stops us from spending image-build minutes when the
  # frontend already failed.
  needs:
    - job: pnpm-build
      artifacts: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - set -euo pipefail
    - docker build
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        --tag "$CI_REGISTRY_IMAGE:latest"
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - frontend/**/*
        - Dockerfile
        - .gitlab-ci.yml

# Publish the Helm chart as an OCI artifact in the project's container
# registry. Flux's HelmRepository (kind: oci) then pulls it without needing
# a git source. Chart version comes from deploy/Chart.yaml — bump that
# field on each release.
helm-publish:
  stage: image
  image: alpine/helm:3
  before_script:
    - helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - set -euo pipefail
    - helm package deploy/ --destination /tmp/
    - helm push /tmp/anvil-*.tgz "oci://$CI_REGISTRY_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - deploy/**/*
        - .gitlab-ci.yml
