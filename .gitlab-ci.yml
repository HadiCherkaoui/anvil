# anvil CI/CD — M0 scaffold.
# Real jobs land in M1 (backend lint/test) and M3 (frontend + docker build).
# Build pipeline order: frontend (pnpm build) -> backend (cargo build --features embed-frontend) -> runtime image.

stages:
  - lint
  - test
  - build

scaffold:
  stage: lint
  image: alpine:3.20
  script:
    - echo "anvil M0 scaffold — jobs land in M1 / M3"
  rules:
    - if: $CI_COMMIT_BRANCH

