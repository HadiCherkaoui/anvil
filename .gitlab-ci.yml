# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence

# container_scanning:
#   variables:
#     DOCKER_IMAGE: ...
#     DOCKER_USER: ...
#     DOCKER_PASSWORD: ...
stages:
- test
- image
".rust_cache":
  key:
    files:
    - backend/Cargo.lock
  paths:
  - backend/.cargo/registry/
  - backend/.cargo/git/
  policy: pull-push
".rust_defaults":
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/backend/.cargo"
  cache:
    key:
      files:
      - backend/Cargo.lock
    paths:
    - backend/.cargo/registry/
    - backend/.cargo/git/
    policy: pull-push
  before_script:
  - rustc --version && cargo --version
  - rustup component add rustfmt clippy
  rules:
  - changes:
    - backend/**/*
    - ".gitlab-ci.yml"
rust-fmt:
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/backend/.cargo"
  cache:
    key:
      files:
      - backend/Cargo.lock
    paths:
    - backend/.cargo/registry/
    - backend/.cargo/git/
    policy: pull-push
  before_script:
  - rustc --version && cargo --version
  - rustup component add rustfmt clippy
  rules:
  - changes:
    - backend/**/*
    - ".gitlab-ci.yml"
  stage: test
  script:
  - set -euo pipefail
  - cd backend && cargo fmt --all -- --check
rust-clippy:
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/backend/.cargo"
  cache:
    key:
      files:
      - backend/Cargo.lock
    paths:
    - backend/.cargo/registry/
    - backend/.cargo/git/
    policy: pull-push
  before_script:
  - rustc --version && cargo --version
  - rustup component add rustfmt clippy
  rules:
  - changes:
    - backend/**/*
    - ".gitlab-ci.yml"
  stage: test
  script:
  - set -euo pipefail
  - cd backend
  - cargo clippy --all-targets --features serve-dir --locked -- -D warnings
  - mkdir -p ../frontend/out
  - cargo clippy --all-targets --features embed --locked -- -D warnings
rust-test:
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/backend/.cargo"
  cache:
    key:
      files:
      - backend/Cargo.lock
    paths:
    - backend/.cargo/registry/
    - backend/.cargo/git/
    policy: pull-push
  before_script:
  - rustc --version && cargo --version
  - rustup component add rustfmt clippy
  rules:
  - changes:
    - backend/**/*
    - ".gitlab-ci.yml"
  stage: test
  script:
  - set -euo pipefail
  - cd backend && cargo test --features serve-dir --locked
docker-build:
  stage: image
  image: docker:27
  needs:
  - job: rust-fmt
    optional: true
  - job: rust-clippy
    optional: true
  - job: rust-test
    optional: true
  services:
  - name: docker:27-dind
    alias: docker
    command:
    - dockerd
    - "--host=tcp://0.0.0.0:2375"
    - "--host=unix:///var/run/docker.sock"
    - "--tls=false"
  variables:
    DOCKER_BUILDKIT: '1'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    "$CI_REGISTRY"
  script:
  - set -euo pipefail
  - docker build --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:latest"
    .
  - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
    - backend/**/*
    - frontend/**/*
    - Dockerfile
    - ".gitlab-ci.yml"
helm-publish:
  stage: image
  image: alpine/helm:3
  before_script:
  - helm registry login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
  - set -euo pipefail
  - helm package deploy/ --destination /tmp/
  - helm push /tmp/anvil-*.tgz "oci://$CI_REGISTRY_IMAGE"
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
    - deploy/**/*
    - ".gitlab-ci.yml"
include:
- template: Jobs/Container-Scanning.gitlab-ci.yml
